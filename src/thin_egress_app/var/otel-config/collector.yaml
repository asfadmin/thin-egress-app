receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  debug:
    verbosity: basic

  otlphttp/otelcollector:
    endpoint: "${OTEL_COLLECTOR_URL}"


# Enables output for traces to log
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/otelcollector,debug]
